name: Renovate
on:
  schedule:
    - cron: '0 0 * * 1-5' # every weekday at 00:00 UTC (09:00 JST)
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run mode - no PRs will be created'
        type: boolean
        required: false
        default: false
      logLevel:
        description: 'Log level'
        type: choice
        required: false
        default: 'info'
        options: [info, debug, trace]
  push:
    branches: [develop, main]
    paths:
      - '.github/renovate.json'
      - '.github/workflows/renovate.yml'
      - 'bun.lock'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Renovate cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/renovate/cache
          key: ${{ runner.os }}-renovate-${{ hashFiles('**/bun.lockb', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-renovate-

      # （Bun キャッシュが不要ならこのステップは削除）
      - name: Setup Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@70ea19f1b0dc8a9cc7af1b4278f8d3fd9778b577 # v43.0.17
        with:
          configurationFile: .github/renovate.json
          # 任意: Renovate のイメージを固定したい場合は下記を有効化
          # renovate-version: ghcr.io/renovatebot/renovate:41.155.3
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: 'install'
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_BASE_DIR: /home/ubuntu/renovate
          RENOVATE_CACHE_DIR: /home/ubuntu/renovate/cache
          RENOVATE_PAGINATE_ALL: 'true'
          RENOVATE_GIT_TIMEOUT: '600000'

      - name: Upload Renovate logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renovate-logs
          path: |
            renovate.log
            /tmp/renovate/cache/renovate.log
          retention-days: 5
