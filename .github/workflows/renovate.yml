name: Renovate
on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (09:00 JST)
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry Run mode - no PRs will be created"
        type: boolean
        required: false
        default: false
      logLevel:
        description: "Log level"
        type: choice
        required: false
        default: "info"
        options: [info, debug, trace]
  push:
    branches: [develop, main]
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"
      - "bun.lock"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Setup Renovate cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/ubuntu/renovate/cache
          key: ${{ runner.os }}-renovate-${{ hashFiles('**/bun.lockb', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-renovate-

      - name: Setup Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@c91a61c730fa166439cd3e2c300c041590002b1d # v44.0.3
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: "install"
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_BASE_DIR: /home/ubuntu/renovate
          RENOVATE_CACHE_DIR: /home/ubuntu/renovate/cache
          RENOVATE_PAGINATE_ALL: "true"
          RENOVATE_GIT_TIMEOUT: "600000"

      - name: Upload Renovate logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: renovate-logs
          path: |
            renovate.log
            /home/ubuntu/renovate/cache/renovate.log
          retention-days: 5
