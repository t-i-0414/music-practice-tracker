name: Renovate
on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC (09:00 JST)
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run mode - no PRs will be created'
        type: boolean
        required: false
        default: false
      logLevel:
        description: 'Log level'
        type: choice
        required: false
        default: 'info'
        options: [info, debug, trace]
  push:
    branches: [develop, main]
    paths:
      - '.github/renovate.json'
      - '.github/workflows/renovate.yml'
      - 'bun.lock'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Renovate cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /home/ubuntu/renovate/cache
          key: ${{ runner.os }}-renovate-${{ hashFiles('**/bun.lockb', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-renovate-

      - name: Setup Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@03026bd55840025343414baec5d9337c5f9c7ea7 # v44.0.4
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BINARY_SOURCE: 'install'
          RENOVATE_REPOSITORY_CACHE: enabled
          RENOVATE_BASE_DIR: /home/ubuntu/renovate
          RENOVATE_CACHE_DIR: /home/ubuntu/renovate/cache
          RENOVATE_PAGINATE_ALL: 'true'
          RENOVATE_GIT_TIMEOUT: '600000'

      - name: Upload Renovate logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renovate-logs
          path: |
            renovate.log
            /home/ubuntu/renovate/cache/renovate.log
          retention-days: 5
