name: CI / Static

permissions:
  contents: read
  pull-requests: write
  security-events: write

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Base Project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

  check-format:
    name: Check Format
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Run Format Check
        run: bun run format:check

  check-spelling:
    name: Check Spelling
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Run Spelling Check
        run: bun run cspell

  check-shell-lint:
    name: Check Shell Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Run Shell Lint Check
        run: bun run lint:shell:check

  check-secret-lint:
    name: Check Secret Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Run Secret Lint Check
        run: bun run lint:secret:check

  check-markdown-lint:
    name: Check Markdown Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Run Markdown Lint Check
        run: bun run lint:markdown:check

  check-dotenv-lint:
    name: Check Dotenv Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Run dotenv-linter
        uses: dotenv-linter/action-dotenv-linter@382525b7d91e7b71b52e064b8f1fa5908c4650d2 # v2
        with:
          reporter: github-pr-review
          dotenv_linter_flags: --skip UnorderedKey

  check-es-lint:
    name: Check ESLint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Setup Backend Project
        uses: ./.github/actions/setup-backend
        with:
          skip_migrations: 'true'
          need_db: 'false'

      - name: Run ESLint Check
        run: bun run lint:es:check

  check-type:
    name: Check Type
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Setup Backend Project
        uses: ./.github/actions/setup-backend
        with:
          skip_migrations: 'true'
          need_db: 'false'

      - name: Run Type Check
        run: bun run type:check

  check-schema:
    name: Check Schema
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project

      - name: Setup Backend Project
        uses: ./.github/actions/setup-backend

      - name: Run Schema Validation
        run: |
          cd packages/apps/backend
          bun run prisma:validate

      - name: Start Backend Server
        uses: ./.github/actions/start-backend

      - name: Generate Admin API Types
        run: |
          cd packages/apps/admin
          bun run gen:api-types

      - name: Generate Mobile API Types
        run: |
          cd packages/apps/mobile
          bun run gen:api-types

      - name: Check Diff
        run: |
          if ! git diff --quiet -- packages/apps/mobile/generated/types/api.d.ts packages/apps/admin/generated/types/api.d.ts; then
            echo "::error::Changes detected in API types. Please run 'bun run gen:api-types' to update them."
            exit 1
          fi

  scan-vulnerability:
    name: Scan Vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # 0.32.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always() # ← always()追加
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = fs.readFileSync('trivy-results.txt', 'utf8');
              const comment = `## 🔍 Security Scan Results\n\`\`\`\n${results}\n\`\`\``;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('No vulnerabilities found or error reading file');
            }
