name: CI / Static

permissions:
  contents: read
  pull-requests: write
  security-events: write

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Base Project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

  check-format:
    name: Check Format
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Run Format Check
        run: bun run format:check

  check-spelling:
    name: Check Spelling
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Run Spelling Check
        run: bun run cspell

  check-shell-lint:
    name: Check Shell Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Run Shell Lint Check
        run: bun run lint:shell:check

  check-secret-lint:
    name: Check Secret Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Run Secret Lint Check
        run: bun run lint:secret:check

  check-markdown-lint:
    name: Check Markdown Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Run Markdown Lint Check
        run: bun run lint:markdown:check

  check-dotenv-lint:
    name: Check Dotenv Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Run dotenv-linter
        uses: dotenv-linter/action-dotenv-linter@21287e2624aaf2dc8da5dd8ccfe8e49c63501116 # v2
        with:
          reporter: github-pr-review
          dotenv_linter_flags: --skip UnorderedKey

  check-lint-and-type:
    name: Check ESLint & Type (Turborepo)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Setup Backend Project
        uses: ./.github/actions/setup-backend
        with:
          skip_migrations: 'true'
          need_db: 'false'

      - name: Generate framework type declarations
        run: |
          echo '/// <reference types="expo/types" />' > packages/apps/mobile/expo-env.d.ts
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > packages/apps/admin/next-env.d.ts

      - name: Run ESLint & Type Check with Turborepo
        run: bun turbo lint:es:check type:check

      - name: Run Root ESLint & Type Check
        run: bun run lint:es:check:root && bun run type:check:root

  check-schema:
    name: Check Schema
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Base Project
        uses: ./.github/actions/setup-base-project
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ secrets.TURBO_TEAM }}

      - name: Setup Backend Project
        uses: ./.github/actions/setup-backend

      - name: Run Schema Validation
        run: |
          cd packages/apps/backend
          bun run prisma:validate
          bun run prisma:schema:diff:check

      - name: Start Backend Server
        uses: ./.github/actions/start-backend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Generate Admin API Types
        run: |
          cd packages/apps/admin
          bun run gen:api-types

      - name: Generate Mobile API Types
        run: |
          cd packages/apps/mobile
          bun run gen:api-types

      - name: Check Diff
        run: |
          if ! git diff --quiet -- packages/apps/mobile/generated/types/api.d.ts packages/apps/admin/generated/types/api.d.ts; then
            echo "::error::Changes detected in API types. Please run 'bun run gen:api-types' to update them."
            exit 1
          fi
