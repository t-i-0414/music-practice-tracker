name: 'Build ESLint Packages'
description: 'Build eslint-configs and eslint-plugins packages using Turborepo'

runs:
  using: 'composite'
  steps:
    - name: Cache Turborepo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Build ESLint Packages with Turborepo
      shell: bash
      run: |
        echo "Building ESLint packages with Turborepo..."
        bun turbo build --filter='@music-practice-tracker/eslint-*'
        echo "ESLint packages built successfully"
