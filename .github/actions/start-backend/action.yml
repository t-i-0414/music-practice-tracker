name: Start Backend Server
description: Start the backend server and wait for it to be ready

runs:
  using: composite
  steps:
    - name: Start Backend Server
      shell: bash
      run: |
        cd packages/apps/backend
        bun run start:dev &

        echo "Waiting for Admin, Mobile, and Firebase Auth emulator to start..."

        timeout 60 bash -c '
          while true; do
            port_mobile_up=false
            port_admin_up=false
            firebase_dev_emulator_up=false
            firebase_test_emulator_up=false

            curl --silent --fail http://localhost:3000/api >/dev/null 2>&1 && port_mobile_up=true
            curl --silent --fail http://localhost:3001/api >/dev/null 2>&1 && port_admin_up=true
            curl --silent --fail http://localhost:4400/emulators >/dev/null 2>&1 && firebase_dev_emulator_up=true
            curl --silent --fail http://localhost:4401/emulators >/dev/null 2>&1 && firebase_test_emulator_up=true

            if [ "$port_mobile_up" = true ] && [ "$port_admin_up" = true ] && [ "$firebase_dev_emulator_up" = true ] && [ "$firebase_test_emulator_up" = true ]; then
              echo "✅ All services are up!"
              exit 0
            fi

            echo -n "."
            sleep 1
          done
        '

        if [ $? -ne 0 ]; then
          echo ""
          echo "❌ One or more services failed to start within 60 seconds"
          curl --silent --fail http://localhost:3000/api >/dev/null 2>&1 || echo "Mobile API Server DOWN"
          curl --silent --fail http://localhost:3001/api >/dev/null 2>&1 || echo "Admin API Server DOWN"
          curl --silent --fail http://localhost:4400/emulators >/dev/null 2>&1 || echo "Firebase Auth Emulator DOWN"
          curl --silent --fail http://localhost:4401/emulators >/dev/null 2>&1 || echo "Firebase Test Emulator DOWN"
          exit 1
        fi
