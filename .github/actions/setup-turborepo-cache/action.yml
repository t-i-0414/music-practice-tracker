name: 'Setup Turborepo Remote Cache'
description: 'Configure Turborepo with Vercel Remote Cache for faster CI builds'

inputs:
  turbo_token:
    description: 'Vercel Remote Cache token (TURBO_TOKEN)'
    required: false
  turbo_team:
    description: 'Vercel team slug for Remote Cache (optional)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Configure Turborepo Remote Cache
      shell: bash
      env:
        TURBO_TOKEN: ${{ inputs.turbo_token }}
        TURBO_TEAM: ${{ inputs.turbo_team }}
      run: |
        if [ -n "$TURBO_TOKEN" ]; then
          echo "Turborepo Remote Cache enabled"
          echo "TURBO_TOKEN=$TURBO_TOKEN" >> $GITHUB_ENV
          echo "TURBO_REMOTE_ONLY=false" >> $GITHUB_ENV

          if [ -n "$TURBO_TEAM" ]; then
            echo "TURBO_TEAM=$TURBO_TEAM" >> $GITHUB_ENV
            echo "Team: $TURBO_TEAM"
          fi
        else
          echo "Turborepo Remote Cache not configured (TURBO_TOKEN not set)"
          echo "Using local cache only"
        fi

    - name: Cache Turborepo Local
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          turbo-${{ runner.os }}-
