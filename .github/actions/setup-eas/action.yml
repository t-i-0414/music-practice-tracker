name: 'Setup EAS'
description: 'Set up Expo EAS CLI for mobile deployments'

inputs:
  expo_token:
    description: 'Expo access token for authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup EAS CLI
      uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
      with:
        eas-version: latest
        token: ${{ inputs.expo_token }}

    - name: Verify EAS CLI Installation
      shell: bash
      run: |
        echo "Verifying EAS CLI installation..."
        eas --version
        echo "EAS CLI installed successfully"
